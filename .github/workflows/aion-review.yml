name: Aion Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  aion-review:
    name: Aion High-Precision Review
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Aion Code Reviewer
        uses: Wall-E-30/code-reviewer@main
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          provider: 'openrouter'
          model: 'openrouter/free'
          api-key: ${{ secrets.OPENROUTER_API_KEY }}
          mode: 'visible'                                 # 'visible' posts PR comments, 'shadow' logs silently
          fail-on-findings: 'true'                        # 'true' blocks merge on bugs, 'false' is advisory
          max-comments: '5'                               # max inline comments per review (anti-spam)
          min-confidence: '0.7'                           # confidence filter (0.0 to 1.0)
